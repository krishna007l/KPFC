<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KP Food Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/login_singup.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <i class="fas fa-utensils"></i>
            <span>KP Food Center</span>
        </div>
        <a href="/" class="home-link">← Back to Home</a>
    </div>

    <!-- Signup Form -->
    <div class="login-container">
        <div class="login-box">
            <h1>Create Account</h1>
            <form class="login-form" method="POST">
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="Full Name" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input name="email" type="email" placeholder="Email Address" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input name="password" minlength="6" type="password" placeholder="Create Password" required>
                </div>
                <button type="submit" class="btn login-btn">Create Account</button>
            </form>
            
            
            
            <div class="signup-link">
                Already have an account? 
                <a href="/login">Login here</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="login-footer">
        <p>© 2024 KP Food Center. All rights reserved.</p>
    </footer>
</body>
</html>
