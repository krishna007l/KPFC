<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krishna Patel Food Center</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../static/home.css">
</head>

<body>

<!-- Header & Navigation -->
<header class="header">
    <div class="nav-container">
        <div class="logo">
            <div class="logo-icon">
                <i class="fas fa-utensils"></i>
            </div>
            <h1 class="logo-text">KPFC</h1>
        </div>
        
        <div class="nav-actions">
            <a href="/logout" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </a>
            
            <button class="cart-btn" onclick="window.location.href='/addcard'">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-text">Cart</span>
            </button>
            
            <button class="cart-btn" onclick="window.location.href='/account'">
                <i class="fas fa-user">account</i>
            </button>
        </div>
    </div>
        

</header>

<!-- Main Content -->
<main class="main-content">

<section class="food-section">

    <div class="section-header">
        <h2 class="section-title">
            <i class="fas fa-fire"></i>
            KPFC FOOD HOUSE
        </h2>
    </div>

    <!-- 🔍 SEARCH BAR (ADDED) -->
    <div class="search-container">
        <i class="fas fa-search search-icon"></i>
        <input 
            type="text" 
            id="searchInput" 
            placeholder="Search food items..." 
            onkeyup="searchFood()"
        >
    </div>
    <!-- 🍱 Category Buttons -->
    <!-- 🍱 Category Buttons -->
    <div class="category-container">
        <button class="cat-btn active" onclick="filterCategory('all', this)">All</button>
        <button class="cat-btn" onclick="filterCategory('Italian', this)">Italian</button>
        <button class="cat-btn" onclick="filterCategory('American', this)">American</button>
        <button class="cat-btn" onclick="filterCategory('Snacks', this)">Snacks</button>
        <button class="cat-btn" onclick="filterCategory('Beverages', this)">Beverages</button>
        <button class="cat-btn" onclick="filterCategory('Desserts', this)">Desserts</button>
        <button class="cat-btn" onclick="filterCategory('Seafood', this)">Seafood</button>
        <button class="cat-btn" onclick="filterCategory('Mexican', this)">Mexican</button>
    </div>




    <!-- Food Grid -->
    <div class="food-grid">
        {% for p in products %}
        <div class="food-card" data-category="{{ p.category }}" onclick="openItem('{{p.id}}', '{{p.name}}', '{{p.image}}', '{{p.price}}')">
            
            <div class="food-img-container">
                <img src="{{ p.image }}" alt="{{ p.name }}" class="food-img">
                <div class="rating-badge">
                    <i class="fas fa-star"></i>
                    {{p.rating}}
                </div>
            </div>
            
            <div class="card-content">
                <h3 class="food-name">{{ p.name }}</h3>
                <p class="food-desc">{{p.description}}</p>
                
                <div class="card-footer">
                    <div class="price-info">
                        <span class="price">₹{{ p.price }}</span>
                    </div>
                    <button class="add-btn" onclick="event.stopPropagation(); openItem('{{p.id}}', '{{p.name}}', '{{p.image}}', '{{p.price}}')">
                        <i class="fas fa-plus"></i>
                        ADD
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</section>
</main>

<!-- Floating Cart -->
<div class="floating-cart" onclick="window.location.href='/addcard'">
    <div class="cart-info">
        <i class="fas fa-shopping-bag"></i>
        <div class="cart-details">
            <span class="cart-items">{{ quantity }} items</span>
            <span class="cart-total">₹{{ total }}</span>
        </div>
    </div>
    <div class="view-cart">
        View Cart
        <i class="fas fa-arrow-right"></i>
    </div>
</div>

<!-- Popup (UNCHANGED) -->
<div id="popup" class="popup">
    <div class="popup-overlay" onclick="closeItem()"></div>
    <div class="popup-container">
        <div class="popup-header">
            <button class="close-btn" onclick="closeItem()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="popup-content">
            <div class="popup-img-container">
                <img id="pop-img" class="popup-img">
            </div>

            <div class="popup-details">
                <h2 id="pop-name"></h2>

                <div class="popup-price-section">
                    <span id="pop-price"></span>

                    <div class="qty-controls">
                        <button onclick="dec()">−</button>
                        <input type="number" id="qty" value="1">
                        <button onclick="inc()">+</button>
                    </div>

                    <span id="total"></span>
                </div>

                <form action="/addcard" method="post">
                    <input type="hidden" id="f-id" name="product_id">
                    <input type="hidden" id="f-name" name="product_name">
                    <input type="hidden" id="f-img" name="product_image">
                    <input type="hidden" id="f-price" name="product_price">
                    <input type="hidden" id="f-quantity" name="quantity">

                    <button type="submit">
                        ADD TO CART ₹<span id="cart-total"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script>
let price = 0;

function openItem(id, name, img, p) {
    document.getElementById("popup").style.display = "flex";
    document.getElementById("pop-name").innerText = name;
    document.getElementById("pop-img").src = img;
    document.getElementById("pop-price").innerText = "₹" + p;

    document.getElementById("f-id").value = id;
    document.getElementById("f-name").value = name;
    document.getElementById("f-img").value = img;
    document.getElementById("f-price").value = p;

    price = parseInt(p);
    document.getElementById("qty").value = 1;
    updateTotal();
}

function closeItem() {
    document.getElementById("popup").style.display = "none";
}

function inc() {
    let q = document.getElementById("qty");
    q.value++;
    updateTotal();
}

function dec() {
    let q = document.getElementById("qty");
    if (q.value > 1) q.value--;
    updateTotal();
}

function updateTotal() {
    let q = document.getElementById("qty").value;
    let total = price * q;
    document.getElementById("total").innerText = "₹" + total;
    document.getElementById("cart-total").innerText = total;
    document.getElementById("f-quantity").value = q;
}

/* 🔍 SEARCH FUNCTION (ADDED) */
function searchFood() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.getElementsByClassName("food-card");

    for (let i = 0; i < cards.length; i++) {
        let name = cards[i]
            .getElementsByClassName("food-name")[0]
            .innerText.toLowerCase();

        cards[i].style.display = name.includes(input) ? "block" : "none";
    }
}

function filterCategory(category) {
    let cards = document.getElementsByClassName("food-card");
    let buttons = document.getElementsByClassName("cat-btn");

    // Active button highlight
    for (let b of buttons) b.classList.remove("active");
    event.target.classList.add("active");

    for (let i = 0; i < cards.length; i++) {
        let cardCategory = cards[i].getAttribute("data-category");

        if (category === "all" || cardCategory === category) {
            cards[i].style.display = "block";
        } else {
            cards[i].style.display = "none";
        }
    }
}


</script>

</body>
</html>
