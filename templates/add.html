<!DOCTYPE html>
<html>
<head>
<title>Food Store</title>
<link rel="stylesheet" href="../static/add.css">
</head>

<body>

<div class="topbar">
    <h1>🍽 Food Store</h1>
    <button onclick="window.location.href='home'">Home</button>
</div>

<h2 class="title">🔥 Popular Foods</h2>

<div class="products">

{% for p in product %}
<div class="box">
    <img src="{{ p.image }}">
    <div class="content">
        <h3>{{ p.name }}</h3>
        <p class="price">₹ {{ p.price }}</p>

        <a href="/remove/{{ p.id }}" >
            <button>Remove</button>
        </a>

    </div>
</div>
{% endfor %}

</div>
<div class="order-box">
    <button  class="order-btn" onclick="window.location.href='bill'">place order</button>
</div>

</body>
</html>
